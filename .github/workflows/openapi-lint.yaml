# Validates docs/openapi.yaml (the normative REST contract) with Redocly CLI.
# Rules live in redocly.yaml; errors fail the job, warnings are annotated.
name: openapi-lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml --format=github-actions
