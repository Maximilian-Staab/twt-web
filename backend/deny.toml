# cargo-deny configuration: licenses, security advisories, dependency hygiene.
#
#   cargo deny check
#
# CI runs the same file (.github/workflows/backend-tests.yaml, job "deny").
# The dependency graph is limited to the target the deployed image runs on, so
# Windows/wasm-only transitive crates are not license-checked.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
# A yanked crate in Cargo.lock is not reproducible: fail instead of warn.
yanked = "deny"
# Fail for unmaintained crates we depend on directly; transitive ones stay
# warnings so the build is not blocked by an abandoned leaf crate.
unmaintained = "workspace"
ignore = [
  # jsonwebtoken 11 reaches rsa/p256/p384 through its pure-Rust `rust_crypto`
  # provider. Both advisories are about *secret-dependent* arithmetic:
  # RUSTSEC-2023-0071 (rsa) is a private-key timing side channel, and
  # RUSTSEC-2026-0387 (crypto-bigint, via p256/p384) leaks through non-constant
  # time bigint ops. This server only *verifies* RS256/RS384/RS512 signatures
  # (src/auth.rs pins Validation::algorithms) against public JWKS components; it
  # holds no signing key outside the local test harness and never verifies an
  # ECDSA token, which works on public inputs anyway. No patched rsa release
  # exists, and the alternative provider (aws-lc-rs) would add a C/cmake
  # toolchain to the build stage for no gain in this threat model.
  { id = "RUSTSEC-2023-0071", reason = "private-key timing side channel; backend verifies with public keys only" },
  { id = "RUSTSEC-2026-0387", reason = "constant-time bigint ops on secrets; RS* verification uses public inputs only" },
]

[bans]
# Duplicate versions are a review prompt, not a failure.
multiple-versions = "warn"
# Cargo.lock is committed; wildcard requirements defeat --locked builds.
wildcards = "deny"

[licenses]
confidence-threshold = 0.9
# GPL-3.0-or-later is the license of this crate itself; everything else is the
# permissive set pulled in by axum/sqlx/tokio/reqwest.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
